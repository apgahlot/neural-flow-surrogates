[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-flow-surrogates"
version = "0.1.0"
description = "Deterministic vs. generative neural surrogates for two-phase flow in porous media"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abhinav Prakash Gahlot"}]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["neuralflow", "neuralflow.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
